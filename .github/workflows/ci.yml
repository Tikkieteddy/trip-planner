name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Match the Vercel project's Node.js version.
          node-version: 24
          cache: npm
      - run: npm ci
      # lint + Vitest + next build; no secrets needed (tests mock Google/Auth0/Redis).
      - run: npm run check
